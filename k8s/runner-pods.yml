apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner-pool
  namespace: web-apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: runner
      status: idle #will be changed to running
  template:
    metadata:
      labels:
        app: runner
        status: idle
    spec:
      volumes:
        - name: workspace
          emptyDir: {}
        - name: pnpm-store
          hostPath:
            path: /mnt/pnpm-store
            type: DirectoryOrCreate
      containers:
        - name: runner
          image: node:20-alpine
          workingDir: /app
          command: ["/bin/sh", "-c", "sleep infinity"]
          volumeMounts:
            - name: workspace
              mountPath: /app
            - name: pnpm-store
              mountPath: /root/.local/share/pnpm
          ports:
            - containerPort: 5173
          resources:
            requests:
              memory: "128Mi"
            limits:
              memory: "768Mi" # Prevent one user from crashing the node

        # 2. THE SYNCER (File Sync)
        - name: syncer
          image:  amazon/aws-cli:latest
          command: ["/bin/sh", "-c", "sleep infinity"]
          env:
            - name: AWS_ACCESS_KEY_ID
              value: "minioadmin"
            - name: AWS_SECRET_ACCESS_KEY
              value: "minioadmin123"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
          volumeMounts:
            - name: workspace
              mountPath: /app
          resources:
            requests:
              memory: "64Mi"
            limits:
              memory: "256Mi"